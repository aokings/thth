<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>予定 | THTH</title><style>

:root{color-scheme:light dark;--bg:#fffdf8;--ink:#26221c;--sub:#6b645a;--faint:#9a9286;--line:#ece6da;--card:#fff;--warm:#f0a040;--blue:#2c5a8c}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Hiragino Sans",sans-serif;line-break:strict}
main{max-width:640px;margin:auto;padding:20px;border:1px solid var(--line);border-radius:12px}
h1{font-size:21px;line-height:1.4;margin:0}
header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
header small,.muted{color:var(--sub)}
small,.hint{font-size:13px}
.mono,time{font-family:ui-monospace,SFMono-Regular,monospace;font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit;cursor:pointer}
button{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:7px 13px}
button:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.55}
.selected,.primary{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.field{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:10px 15px;border-bottom:1px solid var(--line)}
.field:last-child{border:0}
.label{color:var(--sub)}
.value{overflow-wrap:anywhere;white-space:pre-wrap}
.bodytext{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8}
.bodycard{padding:15px;margin-top:13px}
.bodycard .label{margin-bottom:8px}
.hint{color:var(--faint)}
.controls{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 13px}
.row{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line);animation:rise .35s ease-out backwards}
.row:last-child{border:0}
.row .time{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.row>div{min-width:0;overflow-wrap:anywhere}
.row .id{color:var(--faint);font-size:13px}
.badge{background:#fff0da;color:#855300;border-radius:20px;padding:2px 10px;font-size:13px}
.badge.scheduled{background:#e7eff8;color:#2c5a8c}
.dots i{display:inline-block;width:6px;height:6px;margin:0 2px;background:var(--warm);border-radius:50%;animation:hop 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes hop{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.eyes{transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}
95%{transform:scaleY(.1)}
}
.row.leaving{animation:leave .3s ease-in forwards}
.trace{color:var(--faint);font-size:13px}
.gone{text-decoration:line-through}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.metric{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:14px;overflow-wrap:anywhere}
.metric strong{display:block;font-size:26px}
.status{margin-top:12px;padding:12px;border-radius:8px;background:#e4f2e7;color:#27633c}
.action{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.stamp{display:flex;align-items:center;gap:16px}
.seal{border:2px solid #c6442e;border-radius:50%;color:#c6442e;width:58px;height:58px;display:grid;place-items:center;font-weight:bold;font-size:22px}
.done{animation:rise .3s ease-out backwards}
@keyframes rise{from{opacity:0;transform:translateY(5px)}
to{opacity:1;transform:none}
}
@keyframes leave{from{opacity:1;transform:none}
to{opacity:0;transform:scaleY(.1)}
}
@media(max-width:480px){main{padding:14px}
.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
.row{grid-template-columns:75px minmax(0,1fr) auto}
.field{grid-template-columns:60px minmax(0,1fr)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}
}
@media(prefers-color-scheme:dark){:root{--bg:#211f1b;--ink:#f5f0e7;--sub:#c6beb2;--faint:#b8afa2;--line:#514a40;--card:#2c2924;--blue:#a5c6ef}
.badge{background:#59452b;color:#ffe2a6}
.badge.scheduled{background:#30445b;color:#d9eaff}
.status{background:#283f30;color:#cae9d2}
}

</style></head>
<body>
<main><header><svg class="face" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#ffd27a"/><g class="eyes" fill="#3a2a1a"><circle cx="10" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/></g><path d="M10 17 Q14 21 18 17" fill="none" stroke="#3a2a1a" stroke-width="1.5"/></svg><h1>予定</h1><small id="count"></small></header><div id="message" class="hint" role="status">結果を待っています。</div><span id="dots" class="dots" aria-hidden="true"><i></i><i></i><i></i></span><div id="filters" class="controls"></div><label>並べ替え <select id="sort"><option value="time">時刻</option><option value="account">口座</option><option value="status">状態</option></select></label><div id="list" class="card"></div><section id="preview" class="card bodycard" hidden><div class="label">下見</div><div id="preview-fields"></div><div id="preview-text" class="bodytext"></div></section><p class="trace" id="trace" role="status" aria-live="polite" hidden></p></main>
<script>


function el(tag,cls,text){var n=document.createElement(tag);
  if(cls)n.className=cls;
  if(text!==undefined && text!==null)n.textContent=String(text);
  return n;
}

function clear(n){while(n.firstChild)n.removeChild(n.firstChild);
}

function present(v){return v!==undefined && v!==null;
}

function field(root,label,value,cls){if(!present(value))return;
  var row=el('div','field'),l=el('div','label',label),v=el('div','value'+(cls?' '+cls:''),value);
  row.append(l,v);
  root.appendChild(row);
}

// 未提供の欄は補わず、structuredContent のみを表示する。
// リモート MCP（thth.me/mcp）は CLI の --json を output の下に包んで返す。画面が包みを開く（Worker は包み直さない・第24 11/28）。
var remote=false;
function data(result){var sc=result && result.structuredContent && typeof result.structuredContent==='object'?result.structuredContent:{};
  if(typeof sc.command==='string'&&typeof sc.workspace==='string'&&Object.prototype.hasOwnProperty.call(sc,'output')){remote=true;
    return sc.output&&typeof sc.output==='object'&&!Array.isArray(sc.output)?sc.output:{};
  }
  return sc;
}

// リモートで VM の答えが遅いと pending と request_id が返る。間を置いて thth_result を同じ request_id で呼ぶ（6 回まで・書く道具は送り直さない）。
var REQUEST_ID=/^[A-Za-z0-9_-]{43}~[a-z][a-z0-9-]{0,31}$/,waits=0;
function waitFor(sc){var message=document.getElementById('message'),dots=document.getElementById('dots');
  remote=true;
  if(!REQUEST_ID.test(sc.request_id)||waits>=6){dots.hidden=true;
    message.textContent='答えがまだ来ません。少し置いてから、もう一度頼んでください。';
    return;
  }
  waits++;
  dots.hidden=false;
  message.textContent='THTH のサーバーの答えを待っています。';
  var sec=Math.min(Math.max(Number(sc.retry_after_seconds)||20,5),60);
  setTimeout(function(){ththBridge.call('thth_result',{request_id:sc.request_id}).then(function(r){window.ththRender(r||{});
    },function(){dots.hidden=true;
      message.textContent='答えを取り出せませんでした。';
    });
  },sec*1000);
}

var items=[],filter='all',previous=[];
function idof(x){return String(x.id??x.file??x.next_file??'');
}

function key(x){return String(x.account??'')+'\u0001'+idof(x);
}

function draw(){var list=document.getElementById('list');
  var old=Array.from(list.children);
  clear(list);
  old.filter(function(node){return node.dataset.key && !items.some(function(x){return key(x)===node.dataset.key;
    });
  }).forEach(function(node){node.classList.add('leaving');
    list.appendChild(node);
    node.addEventListener('animationend',function(){node.remove();
      ththBridge.resize();
    },{once:true});
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)node.remove();
  });
  var rows=items.filter(function(x){return filter==='all'||(filter.startsWith('status:')?x.status===filter.slice(7):x.account===filter);
  });
  var sort=document.getElementById('sort').value;
  rows.sort(function(a,b){var av=sort==='time'?(a.publish_at??a.next_publish_at??''):a[sort],bv=sort==='time'?(b.publish_at??b.next_publish_at??''):b[sort];
    return String(av??'').localeCompare(String(bv??''));
  });
  rows.forEach(function(x,i){var row=el('div','row');
    row.dataset.key=key(x);
    row.style.animationDelay=(i*.04)+'s';
    var time=el('div','mono');
    var at=x.publish_at??x.next_publish_at;
    if(typeof at==='string'){var match=at.match(/^(.*?)[T ](\d{2}:\d{2})(.*)$/);
      if(match){time.append(el('div','hint',match[1]),el('div','time',match[2]),el('div','hint',match[3]));
      }
      else time.appendChild(el('div','time',at));
    }
    else time.appendChild(el('div','time','未定'));
    var mid=el('div');
    mid.appendChild(el('strong','',x.account??''));
    mid.appendChild(el('div','id mono',idof(x)));
    var details=[];
    if(present(x.error))details.push('取得できない: '+String(x.error));
    if(Array.isArray(x.cannot_say))x.cannot_say.forEach(function(v){details.push(String(v));});
    if(x.counts&&typeof x.counts==='object')Object.keys(x.counts).forEach(function(k){details.push(k+' '+x.counts[k]);
    });
    if(present(x.approved_waiting))details.push('approved '+x.approved_waiting);
    if(present(x.type_mismatch))details.push('型外 '+x.type_mismatch);
    ['unapproved_soon','held_soon'].forEach(function(k){var v=x[k];
      if(v&&typeof v==='object'){if(present(v.count))details.push(k+' '+v.count);
        if(present(v.first_at))details.push(String(v.first_at));
        if(Array.isArray(v.paths))v.paths.forEach(function(path){details.push(String(path));
        });
      }
    });
    if(details.length)mid.appendChild(el('div','hint',details.join(' · ')));
    var tail=el('div');
    if(present(x.status))tail.appendChild(el('span','badge'+(x.status==='scheduled'?' scheduled':''),x.status));
    var file=x.file??(typeof x.queue_dir==='string'&&typeof x.next_file==='string'?x.queue_dir.replace(/\/$/,'')+'/'+x.next_file:null);
    // リモートには下見の道具（thth_preview）が無いので、開くを出さない。
    if(!remote&&typeof file==='string'&&/^[^\u0000]{1,1024}\.md$/.test(file)){var button=el('button','','開く');
      button.addEventListener('click',function(){button.disabled=true;
        ththBridge.call('thth_preview',{file:file}).then(function(result){button.disabled=false;
          var d=data(result),t=d.text??d.body;
          if(!result.isError&&typeof t==='string'){var pf=document.getElementById('preview-fields');
            clear(pf);
            field(pf,'宛先',d.account);
            field(pf,'日時',d.publish_at??d.scheduled_at??d.posted_at,'mono');
            document.getElementById('preview-text').textContent=String(t);
            document.getElementById('preview').hidden=false;
            ththBridge.resize();
          }
          else document.getElementById('message').textContent='下見の本文がありません。';
        },function(){button.disabled=false;
          document.getElementById('message').textContent='下見を開けませんでした。';
        });
      });
      tail.appendChild(button);
    }
    row.append(time,mid,tail);
    list.appendChild(row);
  });
  document.getElementById('count').textContent=items.length+' 件';
  ththBridge.resize();
}

document.getElementById('sort').addEventListener('change',draw);

window.ththRender=function(result){var sc=result&&result.structuredContent;
  if(sc&&typeof sc==='object'&&sc.status==='pending'&&typeof sc.request_id==='string'){waitFor(sc);
    return;
  }
  var d=data(result),next=[];
  document.getElementById('dots').hidden=true;
  if(result.isError||d.error){document.getElementById('message').textContent='予定を読み込めませんでした。'+(typeof d.error==='string'?' '+d.error:'');
    return;
  }
  var known=Array.isArray(d.drafts)||Array.isArray(d.items)||Array.isArray(d.accounts)||Object.keys(d).some(function(k){var x=d[k];return x&&typeof x==='object'&&!Array.isArray(x)&&(present(x.counts)||present(x.next_file)||present(x.error));});
  if(!known){document.getElementById('message').textContent='表示できる結果が不足しています。';return;}
  if(Array.isArray(d.drafts))next=d.drafts.filter(function(x){return x&&typeof x==='object';
  }).map(function(x){return Object.assign({account:d.account,id:x.draft_id},x);
  });
  else if(Array.isArray(d.items))next=d.items.filter(function(x){return x&&typeof x==='object';
  });
  else if(Array.isArray(d.accounts))next=d.accounts.filter(function(x){return x&&typeof x==='object';
  });
  else Object.keys(d).forEach(function(k){var x=d[k];
    if(x&&typeof x==='object'&&!Array.isArray(x)&&(present(x.next_file)||present(x.counts)||present(x.error)))next.push(Object.assign({account:k},x));
  });
  var gone=previous.filter(function(x){return idof(x)&&!next.some(function(y){return key(y)===key(x);
    });
  });
  items=next;
  previous=next.slice();
  var trace=document.getElementById('trace');
  if(gone.length){clear(trace);
    trace.appendChild(document.createTextNode(gone.length+' 件 消えた（'));
    gone.forEach(function(x,i){if(i)trace.appendChild(document.createTextNode('・'));
      trace.appendChild(el('span','gone',idof(x)));
    });
    trace.appendChild(document.createTextNode('）'));
    trace.hidden=false;
  }
  var filters=document.getElementById('filters');
  clear(filters);
  var accounts=Array.from(new Set(items.map(function(x){return x.account;
  }).filter(function(x){return typeof x==='string';
  })));
  [['すべて','all']].concat(accounts.map(function(a){return[a,a];
  }),Array.from(new Set(items.map(function(x){return x.status;
  }).filter(function(x){return typeof x==='string';
  }))).map(function(x){return [x,'status:'+x];
  })).forEach(function(pair){var b=el('button',filter===pair[1]?'selected':'',pair[0]);
    b.setAttribute('aria-pressed',String(filter===pair[1]));
    b.addEventListener('click',function(){filter=pair[1];
      window.ththRender(result);
    });
    filters.appendChild(b);
  });
  document.getElementById('message').textContent=items.length?'':'表示できる予定はありません。';
  draw();
};

/* thth-bridge:begin */
(function () {
  var nextId = 1, pending = Object.create(null);

  function send(message) { window.parent.postMessage(Object.assign({jsonrpc:"2.0"}, message), "*");
  }

  function request(method, params) { return new Promise(function(resolve,reject) { var id=nextId++;
      pending[id]={resolve:resolve,reject:reject};
      send({id:id,method:method,params:params});
    });
  }

  function resize() { send({method:"ui/notifications/size-changed",params:{width:document.body.scrollWidth,height:Math.ceil(document.body.getBoundingClientRect().height)}
    });
  }

  window.ththBridge = {call:function(name,args){return request("tools/call",{name:name,arguments:args});
    },resize:resize};

  window.addEventListener("message",function(event) {
    if(event.source !== window.parent) return;

    var m=event.data;
    if(!m || m.jsonrpc!=="2.0") return;

    if(m.id != null && pending[m.id] && !m.method) {var p=pending[m.id];
      delete pending[m.id];
      if(m.error) p.reject(m.error);
      else p.resolve(m.result);
      return;
    }

    if(m.method==="ui/notifications/tool-input" && window.ththInput) window.ththInput(m.params || {});

    if(m.method==="ui/notifications/tool-result" && window.ththRender) window.ththRender(m.params || {});

  });

  request("ui/initialize",{appInfo:{name:"thth-ui",version:"0.1.0"},appCapabilities:{},protocolVersion:"2026-01-26"}).then(function(){send({method:"ui/notifications/initialized"});
    resize();
  },function(){document.getElementById("message").textContent="host とつながりませんでした。";
  });

  if(window.ResizeObserver) new ResizeObserver(resize).observe(document.documentElement);

})();

/* thth-bridge:end */
</script>
</body>
</html>
