<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>host の代わり（確かめ用）</title></head>
<body>
<p id="log">host の代わり: 待っている</p>
<iframe id="v" sandbox="allow-scripts" style="width:100%;height:300px;border:1px solid #999"></iframe>
<script>
// 仕様の既定の CSP（ui.csp を言わないとき host が掛ける物・apps.mdx「Restrictive Default」）を掛けて読む。
var CSP = "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; " +
          "img-src 'self' data:; media-src 'self' data:; connect-src 'none';";
fetch("probe.html").then(function (r) { return r.text(); }).then(function (html) {
  document.getElementById("v").srcdoc = html.replace("<head>",
    '<head><meta http-equiv="Content-Security-Policy" content="' + CSP + '">');
});
</script>
<script>
// probe.html の橋渡しだけを確かめる偽の host。本物の host（Claude のデスクトップ）の代わりにはならない。
var seen = [];
function log(t) { seen.push(t); document.getElementById("log").textContent = "host の代わり: " + seen.join(" → "); }
window.addEventListener("message", function (ev) {
  var m = ev.data, w = document.getElementById("v").contentWindow;
  if (!m || m.jsonrpc !== "2.0") return;
  log(m.method || "response");
  if (m.method === "ui/initialize") {
    w.postMessage({ jsonrpc: "2.0", id: m.id, result: { protocolVersion: "2026-01-26", hostInfo: { name: "fake", version: "0" }, hostCapabilities: {}, hostContext: {} } }, "*");
  }
  if (m.method === "ui/notifications/initialized") {
    w.postMessage({ jsonrpc: "2.0", method: "ui/notifications/tool-input", params: { arguments: {} } }, "*");
    w.postMessage({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: {
      content: [{ type: "text", text: "見本" }],
      structuredContent: { note: "見本（偽のデータ）", items: [
        { id: "d-001", account: "sample-threads", status: "approved", publish_at: "2026-12-01T09:00:00+09:00" },
        { id: "d-003", account: "sample-threads", status: "draft", publish_at: null }] } } }, "*");
  }
});
</script>
</body>
</html>
