# main への push で全件テストを Linux で回す（2026-09-16）。
#
# **なぜ要るか。** 配布の workflow（`publish.yml`）は tag を push したときに
# Linux で全件テストを回してから PyPI と registry へ出す。ところが開発は macOS で
# 全件を回してきたので、**Linux でだけ落ちるテスト**があると、版を出す瞬間に
# 初めて気づくことになる（tag は残り、直して版を上げ直す手間が出る）。
# main に入るたびにここで先に回しておけば、配布の日に驚かない。
#
# **何も出さない・秘密を使わない。** テストを回すだけ。本番（VM）にも触らない。
name: test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1 台で 12 分ほどかかるようになったので、試験のファイルを 4 つに分けて並べて回す
  # （2026-10-30 masaru「出すのにどんどん時間がかかる」）。分け方は名前の順に 4 つおきで、
  # 漏れが無いことは最後の job が件数の合計で確かめる。
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存を入れる
        run: python -m pip install --quiet --upgrade build pytest pytest-xdist

      - name: 全件テスト（4 つに分けたうちの 1 つ）
        run: |
          python - <<'EOF' > files.txt
          import pathlib
          files = sorted(str(p) for p in pathlib.Path("tests").glob("test_*.py"))
          print("\n".join(files[${{ matrix.shard }}::4]))
          EOF
          wc -l < files.txt > count.txt
          python -m pytest $(cat files.txt) -q -n auto -p no:cacheprovider

      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: count.txt

  all-files:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
      - name: 4 つの分け前を足すと全部のファイルになる
        run: |
          total=$(ls tests/test_*.py | wc -l)
          got=$(cat shard-*/count.txt | awk '{s+=$1} END {print s}')
          echo "全部 ${total}・回した ${got}"
          test "$total" = "$got"
